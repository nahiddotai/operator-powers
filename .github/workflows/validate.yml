name: validate and deploy
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: operator-powers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Static package validation
        run: node plugins/operator-powers/scripts/validate-package.mjs
      - name: Version sync
        run: node plugins/operator-powers/scripts/verify-version-sync.mjs
      - name: Hook runner tests
        run: node plugins/operator-powers/scripts/test-hook-runner.mjs
      - name: Install MCP development dependencies
        run: npm ci
        working-directory: mcp-service
      - name: Type-check MCP service
        run: npx tsc --noEmit
        working-directory: mcp-service
      - name: Bundle MCP service without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/operator-powers-worker
        working-directory: mcp-service
      - name: Version sync against tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node plugins/operator-powers/scripts/verify-version-sync.mjs "${GITHUB_REF_NAME}"

  deploy:
    name: Deploy production Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-service/package-lock.json
      - name: Install MCP dependencies
        run: npm ci
        working-directory: mcp-service
      - name: Apply idempotent D1 schema
        run: npx wrangler d1 execute operator-powers --remote --file schema.sql
        working-directory: mcp-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mcp-service
          command: deploy
      - name: Verify production health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            https://operator-powers.nahiddotai.workers.dev/health \
            | grep -q '"status":"healthy"'
